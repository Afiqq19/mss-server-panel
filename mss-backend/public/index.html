<!DOCTYPE html>
<html lang="id">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MSS Server Panel - Self-Hosted Infrastructure Manager untuk Server Laptop Toshiba">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#030712">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MSS Server Panel">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=mss4"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=mss4"/>
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=mss4"/>

  <title>MSS Server Panel</title>
  <link rel="manifest" href="manifest.json?v=7">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #030712;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    #mss-preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 30%, #0F172A 0%, #030712 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s;
    }

    .preloader-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, rgba(59, 130, 246, 0.05) 50%, transparent 70%);
      border-radius: 50%;
      filter: blur(40px);
      animation: pulseGlow 3s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.9); opacity: 0.5; }
      100% { transform: scale(1.15); opacity: 1; }
    }

    .logo-badge-container {
      position: relative;
      width: 88px;
      height: 88px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cyber-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      border: 2px solid transparent;
      border-top-color: #06B6D4;
      border-right-color: #3B82F6;
      animation: spinRing 2.4s linear infinite;
    }

    .cyber-ring-outer {
      position: absolute;
      width: 108px;
      height: 108px;
      border-radius: 30px;
      border: 1px dashed rgba(6, 182, 212, 0.25);
      animation: spinRingReverse 6s linear infinite;
    }

    @keyframes spinRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spinRingReverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    .logo-core {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6), 0 0 15px rgba(6, 182, 212, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 2;
      overflow: hidden;
    }

    .logo-core img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .brand-title {
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 6px;
      text-transform: uppercase;
      background: linear-gradient(to right, #FFFFFF, #94A3B8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      color: #64748B;
      font-size: 11px;
      letter-spacing: 1.5px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .progress-bar-wrapper {
      width: 220px;
      height: 4px;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .progress-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #06B6D4, #3B82F6, #8B5CF6);
      border-radius: 999px;
      animation: scanBeam 1.8s ease-in-out infinite;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.6);
    }

    @keyframes scanBeam {
      0% { left: -45%; width: 35%; }
      50% { width: 55%; }
      100% { left: 100%; width: 35%; }
    }

    .status-text {
      color: #94A3B8;
      font-size: 12px;
      font-weight: 500;
      min-height: 18px;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body style="background-color: #030712;">
  <!-- Modern Futuristic Preloader -->
  <div id="mss-preloader">
    <div class="preloader-glow"></div>
    <div class="logo-badge-container">
      <div class="cyber-ring-outer"></div>
      <div class="cyber-ring"></div>
      <div class="logo-core">
        <img src="favicon.png" alt="MSS Logo" onerror="this.style.display='none'; document.getElementById('alt-icon').style.display='block';">
        <svg id="alt-icon" style="display:none; width:34px; height:34px; fill:#06B6D4;" viewBox="0 0 24 24">
          <path d="M4 1h16a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zm0 8h16a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1zm0 8h16a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1zM6 4h2V3H6v1zm0 8h2v-1H6v1zm0 8h2v-1H6v1z"/>
        </svg>
      </div>
    </div>
    <div class="brand-title">MSS SERVER PANEL</div>
    <div class="brand-subtitle">Self-Hosted Infrastructure</div>
    <div class="progress-bar-wrapper">
      <div class="progress-bar-fill"></div>
    </div>
    <div class="status-text" id="status-label">Menginisialisasi Engine...</div>
  </div>

  <script>
    // Rotasi status text dinamis
    (function() {
      const messages = [
        "Menginisialisasi Engine...",
        "Sinkronisasi Docker Daemon...",
        "Menghubungkan ke Toshiba Host...",
        "Menyiapkan Antarmuka Panel..."
      ];
      let idx = 0;
      const label = document.getElementById('status-label');
      if (label) {
        setInterval(() => {
          idx = (idx + 1) % messages.length;
          label.style.opacity = '0';
          setTimeout(() => {
            label.textContent = messages[idx];
            label.style.opacity = '1';
          }, 300);
        }, 1500);
      }
    })();

    // Sembunyikan preloader setelah Flutter siap
    window.addEventListener('flutter-first-frame', function() {
      const loader = document.getElementById('mss-preloader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.style.display = 'none';
        }, 500);
      }
    });

    // Fallback timer maksimal 8 detik jika event flutter-first-frame tertunda
    setTimeout(() => {
      const loader = document.getElementById('mss-preloader');
      if (loader && loader.style.display !== 'none') {
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.style.display = 'none';
        }, 500);
      }
    }, 8000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
