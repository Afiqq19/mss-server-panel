server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Batasi ukuran payload untuk mencegah buffer overflow & flood DoS
    client_max_body_size 64M;

    # Proteksi HTTP Methods: Blokir TRACE & TRACK untuk mencegah Cross-Site Tracing (XST)
    if ($request_method ~ ^(TRACE|TRACK)$ ) {
        return 405;
    }

    # Blokir Automated Vulnerability & Security Scanners
    if ($http_user_agent ~* (nikto|sqlmap|masscan|nmap|dirbuster|gobuster|wpscan|acunetix|havij|zmeu|binlar|casper) ) {
        return 403;
    }

    # =========================================================================
    # ZERO-TRUST & CYBERSECURITY HEADERS (Mencegah XSS, Clickjacking, MIME-Sniff)
    # =========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # GZIP Compression untuk akselerasi loading bundle Flutter Web
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml
        font/woff2;

    # =========================================================================
    # BLOKIR FILE SENSITIF (.git, .env, .sql, .bak, .sh, .sqlite, .yml)
    # =========================================================================
    location ~* /\.(?!well-known) {
        deny all;
        return 404;
    }
    location ~* \.(env|git|sql|bak|log|conf|sh|yml|yaml|sqlite|sqlite3)$ {
        deny all;
        return 404;
    }

    # Caching untuk file HTML, version.json, dan service worker (selalu cek versi terbaru)
    location ~* ^/(index\.html|version\.json|flutter_service_worker\.js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Caching untuk library CanvasKit & WebAssembly (File besar ~5MB, sangat hemat bandwidth)
    location ~* \.(wasm)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Caching untuk aset statis gambar, favicon, dan font
    location ~* \.(ico|jpg|jpeg|png|gif|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Bundle JavaScript Flutter (main.dart.js, flutter.js)
    location ~* \.(js)$ {
        add_header Cache-Control "public, no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Proxy API calls ke Laravel backend (termasuk update-rahasia-panel)
    location /api {
        proxy_pass http://mss-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Proxy web routes (update-rahasia-panel, deploy-update) ke Laravel
    location ~* ^/(update-rahasia-panel|deploy-update) {
        proxy_pass http://mss-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Proxy Web Terminal (ttyd) dengan Proteksi Zero-Trust Referer Barrier
    location ^~ /ttyd/ {
        # Hanya izinkan akses jika dipanggil dari iframe aplikasi MSS Panel
        valid_referers server_names panel.xie.my.id ~\.xie\.my\.id;
        if ($invalid_referer) {
            return 403;
        }

        proxy_pass http://mss-ttyd:7681;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
